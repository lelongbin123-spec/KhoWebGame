<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc học vui | Trò chơi tương tác</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700&display=swap');

        :root {
            --ink: #19324a;
            --muted: #60768b;
            --cream: #fffaf0;
            --paper: #ffffff;
            --teal: #087f8c;
            --teal-dark: #075a67;
            --coral: #e7654d;
            --yellow: #f6c85f;
            --line: #e6e2d8;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            font-family: 'Be Vietnam Pro', sans-serif;
            background:
                radial-gradient(circle at 8% 8%, rgba(246, 200, 95, .28), transparent 24%),
                radial-gradient(circle at 94% 92%, rgba(8, 127, 140, .15), transparent 28%),
                var(--cream);
        }
        .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 54px 0 40px; }
        .eyebrow { color: var(--coral); font-size: .76rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1 { max-width: 620px; margin: 10px 0 12px; font-family: Fraunces, Georgia, serif; font-size: clamp(2.5rem, 6vw, 4.8rem); line-height: .98; letter-spacing: 0; }
        .intro { max-width: 560px; margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.7; }
        .count { min-width: 155px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.7); text-align: left; }
        .count strong { display: block; color: var(--teal); font-size: 2rem; line-height: 1; }
        .count span { display: block; margin-top: 8px; color: var(--muted); font-size: .78rem; font-weight: 700; }
        .section-heading { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 20px; border-bottom: 1px solid var(--line); }
        .section-heading h2 { margin: 0 0 12px; font-size: 1.15rem; }
        .section-heading p { margin: 0 0 12px; color: var(--muted); font-size: .85rem; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding-bottom: 52px; }
        .card { position: relative; display: flex; min-height: 240px; flex-direction: column; justify-content: space-between; overflow: hidden; padding: 25px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); text-decoration: none; color: inherit; box-shadow: 0 8px 24px rgba(25,50,74,.06); transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
        .card:not(.disabled):hover { transform: translateY(-5px); border-color: var(--teal); box-shadow: 0 14px 30px rgba(25,50,74,.13); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .icon { display: grid; width: 54px; height: 54px; place-items: center; border-radius: 50%; background: #e4f3f0; font-size: 1.75rem; }
        .tag { padding: 6px 10px; border-radius: 20px; background: #fff2d4; color: #956719; font-size: .7rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
        .card h3 { max-width: 330px; margin: 22px 0 7px; font-size: 1.25rem; line-height: 1.25; }
        .card p { max-width: 430px; margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.6; }
        .action { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; color: var(--teal-dark); font-size: .86rem; font-weight: 800; }
        .action::after { content: '→'; font-size: 1.2rem; transition: transform .2s ease; }
        .card:hover .action::after { transform: translateX(4px); }
        .card:nth-child(2) .icon { background: #fff0df; }
        .card:nth-child(3) .icon { background: #eaf0ff; }
        .card:nth-child(4) .icon { background: #e9f5e5; }
        .disabled { background: #f6f5f1; color: #7e8c94; pointer-events: none; }
        .disabled .icon { filter: grayscale(1); opacity: .7; }
        .disabled .tag { background: #e7e8e6; color: #6e7778; }
        .disabled .action { color: #7e8c94; }
        footer { padding: 18px 0 34px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
        @media (max-width: 680px) {
            .shell { width: min(100% - 28px, 520px); }
            header { display: block; padding: 34px 0 30px; }
            .count { display: inline-block; margin-top: 24px; }
            .grid { grid-template-columns: 1fr; }
            .card { min-height: 220px; }
            .section-heading p { display: none; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header>
            <div>
                <h1>Kho trò chơi tương tác</h1>
            </div>
            <div class="count"><strong id="game-count">00</strong><span>trò chơi</span></div>
        </header>

        <section aria-labelledby="games-title">
            <div class="section-heading">
                <h2 id="games-title">Chọn trò chơi</h2>
                <p>Trò chơi đã sẵn sàng</p>
            </div>
            <div class="grid" id="games-grid">
                <!-- Nội dung các thẻ card sẽ được render bằng JavaScript -->
            </div>
        </section>
        <footer>Học qua trải nghiệm · Mỗi trò chơi là một chuyến khám phá nhỏ</footer>
    </main>

    <script>
        async function loadAndRenderGames() {
            const gridContainer = document.getElementById('games-grid');
            const countDisplay = document.getElementById('game-count');

            try {
                const res = await fetch('data.json');
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                
                const games = await res.json();

                // Cập nhật số lượng hiển thị (định dạng 2 chữ số: 01, 02, ...)
                countDisplay.textContent = String(games.length).padStart(2, '0');

                // Tạo HTML cho từng card và gắn vào grid
               gridContainer.innerHTML = games.map(game => `
                <a class="card ${game.disabled ? 'disabled' : ''}" data-id="${game.id}" href="${game.url || '#'}">
                    <div>
                        <div class="card-top">
                            <span class="icon">${game.icon}</span>
                            <span class="tag">${game.tag}</span>
                        </div>
                        <h3>${game.title}</h3>
                        <p>${game.description}</p>
                    </div>
                    <span class="action">${game.disabled ? 'Chưa mở' : 'Chơi ngay'}</span>
                </a>
            `).join('');

            } catch (err) {
                console.error('Không thể tải danh sách trò chơi:', err);
                gridContainer.innerHTML = '<p style="color: var(--muted); grid-column: 1 / -1;">Không thể tải dữ liệu trò chơi. Vui lòng thử lại sau.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadAndRenderGames);
    </script>
</body>
</html>
